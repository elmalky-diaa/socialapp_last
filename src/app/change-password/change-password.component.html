<div class="mx-auto max-w-7xl px-3 py-3.5">
  <main class="min-w-0">
    <div class="mx-auto max-w-2xl">
      <section class="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm sm:p-6">
        <!-- Header -->
        <div class="mb-5 flex items-center gap-3">
          <span
            class="inline-flex h-10 w-10 items-center justify-center rounded-full bg-[#e7f3ff] text-[#1877f2]"
          >
            <svg
              xmlns="http://w3.org"
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              class="lucide lucide-key-round"
              aria-hidden="true"
            >
              <path
                d="M2.586 17.414A2 2 0 0 0 2 18.828V21a1 1 0 0 0 1 1h3a1 1 0 0 0 1-1v-1a1 1 0 0 1 1-1h1a1 1 0 0 0 1-1v-1a1 1 0 0 1 1-1h.172a2 2 0 0 0 1.414-.586l.814-.814a6.5 6.5 0 1 0-4-4z"
              ></path>
              <circle cx="16.5" cy="7.5" r=".5" fill="currentColor"></circle>
            </svg>
          </span>
          <div>
            <h1 class="text-xl font-extrabold text-slate-900 sm:text-2xl">Change Password</h1>
            <p class="text-sm text-slate-500">
              Keep your account secure by using a strong password.
            </p>
          </div>
        </div>

        <!-- Global Messages (Success / Error) -->
        @if (msError()) {
          <div
            class="mb-4 rounded-xl bg-red-50 p-3 text-sm font-semibold text-red-600 border border-red-100"
          >
            {{ msError() }}
          </div>
        }
        @if (msSuccess()) {
          <div
            class="mb-4 rounded-xl bg-green-50 p-3 text-sm font-semibold text-green-600 border border-green-100"
          >
            {{ msSuccess() }}
          </div>
        }

        <!-- Change Password Form -->
        <form
          [formGroup]="changePasswordForm"
          (ngSubmit)="changePassword()"
          novalidate
          class="space-y-4"
        >
          <!-- Current Password Field -->
          <label class="block">
            <span class="mb-1.5 block text-sm font-bold text-slate-700">Current password</span>
            <div class="relative">
              <input
                #currentPassInput
                formControlName="currentPassword"
                placeholder="Enter current password"
                class="w-full rounded-xl border bg-slate-50 pl-3 pr-14 py-2.5 text-sm text-slate-800 outline-none transition border-slate-200 focus:border-[#1877f2] focus:bg-white"
                type="password"
              />
              <button
                type="button"
                (click)="togglePass(currentPassInput)"
                class="absolute right-3 top-1/2 -translate-y-1/2 text-xs font-bold text-[#1877f2] hover:text-[#166fe5]"
              >
                Show/Hide
              </button>
            </div>
            @if (
              changePasswordForm.get('currentPassword')?.touched &&
              changePasswordForm.get('currentPassword')?.hasError('required')
            ) {
              <span class="mt-1 block text-xs text-red-500">Current password is required.</span>
            }
          </label>

          <!-- New Password Field -->
          <label class="block">
            <span class="mb-1.5 block text-sm font-bold text-slate-700">New password</span>
            <div class="relative">
              <input
                #newPassInput
                formControlName="password"
                placeholder="Enter new password"
                class="w-full rounded-xl border bg-slate-50 pl-3 pr-14 py-2.5 text-sm text-slate-800 outline-none transition border-slate-200 focus:border-[#1877f2] focus:bg-white"
                type="password"
              />
              <button
                type="button"
                (click)="togglePass(newPassInput)"
                class="absolute right-3 top-1/2 -translate-y-1/2 text-xs font-bold text-[#1877f2] hover:text-[#166fe5]"
              >
                Show/Hide
              </button>
            </div>

            <!-- Validation Messages -->
            @if (changePasswordForm.get('password')?.touched) {
              @if (changePasswordForm.get('password')?.hasError('required')) {
                <span class="mt-1 block text-xs text-red-500">New password is required.</span>
              } @else if (changePasswordForm.get('password')?.hasError('pattern')) {
                <span class="mt-1 block text-xs text-red-500"
                  >Password must be at least 8 characters with uppercase, lowercase, number, and
                  special character.</span
                >
              }
            } @else {
              <span class="mt-1 block text-xs text-slate-500"
                >At least 8 characters with uppercase, lowercase, number, and special
                character.</span
              >
            }
          </label>

          <!-- Submit Button -->
          <button
            type="submit"
            [disabled]="changePasswordForm.invalid || loading()"
            class="inline-flex w-full items-center justify-center gap-2 rounded-xl bg-[#1877f2] px-4 py-2.5 text-sm font-bold text-white transition hover:bg-[#166fe5] disabled:cursor-not-allowed disabled:opacity-60"
          >
            @if (loading()) {
              <!-- Loading Spinner Icon -->
              <svg
                class="animate-spin h-5 w-5 text-white"
                xmlns="http://w3.org"
                fill="none"
                viewBox="0 0 24 24"
              >
                <circle
                  class="opacity-25"
                  cx="12"
                  cy="12"
                  r="10"
                  stroke="currentColor"
                  stroke-width="4"
                ></circle>
                <path
                  class="opacity-75"
                  fill="currentColor"
                  d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"
                ></path>
              </svg>
              Updating...
            } @else {
              Update password
            }
          </button>
        </form>
      </section>
    </div>
  </main>
</div>
