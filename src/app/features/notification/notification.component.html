<div class="mx-auto max-w-7xl px-3 py-3.5">
  <main class="min-w-0">
    <section class="rounded-xl border border-slate-200 bg-white shadow-sm sm:rounded-2xl">
      <div class="border-b border-slate-200 p-4 sm:p-5">
        <div class="flex flex-wrap items-start justify-between gap-3">
          <div>
            <h2 class="text-xl font-black text-slate-900 sm:text-2xl">Notifications</h2>
            <p class="mt-1 text-sm text-slate-500">
              Realtime updates for likes, comments, shares, and follows.
            </p>
          </div>
          <button
            class="inline-flex w-full items-center justify-center gap-2 rounded-lg border border-slate-200 bg-slate-50 px-3 py-2 text-sm font-bold text-slate-700 transition hover:bg-slate-100 disabled:cursor-not-allowed disabled:opacity-60 sm:w-auto"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="15"
              height="15"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              class="lucide lucide-check-check"
              aria-hidden="true"
            >
              <path d="M18 6 7 17l-5-5"></path>
              <path d="m22 10-7.5 7.5L13 16"></path></svg
            >Mark all as read
          </button>
        </div>
        <div class="mt-4 grid grid-cols-2 gap-2 sm:flex sm:items-center">
          <button
            type="button"
            class="rounded-full px-4 py-1.5 text-sm font-bold transition bg-[#1877f2] text-white"
          >
            All</button
          ><button
            type="button"
            class="inline-flex items-center gap-2 rounded-full px-4 py-1.5 text-sm font-bold transition bg-slate-100 text-slate-700 hover:bg-slate-200"
          >
            Unread<span class="rounded-full px-2 py-0.5 text-xs bg-white text-[#1877f2]">30</span>
          </button>
        </div>
      </div>
      <div class="space-y-2 p-3 sm:p-4">
        @for (item of allNotifications(); track item._id) {
          <article
            class="group relative flex gap-3 rounded-xl border p-3 transition sm:rounded-2xl sm:p-4 border-[#dbeafe] bg-[#edf4ff]"
          >
            <div class="relative shrink-0">
              <button type="button" class="block cursor-pointer">
                <img
                  [alt]="item.actor.name"
                  class="h-11 w-11 rounded-full object-cover"
                  [src]="item.actor.photo"
                /></button
              ><span
                class="absolute -bottom-1 -right-1 inline-flex h-5 w-5 items-center justify-center rounded-full bg-white ring-2 ring-white text-[#1877f2]"
                ><svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="15"
                  height="15"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  class="lucide lucide-message-circle"
                  aria-hidden="true"
                >
                  <path
                    d="M2.992 16.342a2 2 0 0 1 .094 1.167l-1.065 3.29a1 1 0 0 0 1.236 1.168l3.413-.998a2 2 0 0 1 1.099.092 10 10 0 1 0-4.777-4.719"
                  ></path></svg
              ></span>
            </div>
            <div class="min-w-0 flex-1">
              <div class="flex flex-wrap items-start justify-between gap-1.5 sm:gap-2">
                <p class="text-sm leading-6 text-slate-800">
                  <button type="button" class="font-extrabold hover:text-[#1877f2] hover:underline">
                    {{ item.actor.name }}
                  </button>
                  commented on your post
                </p>
                <div class="flex items-center gap-1.5 sm:gap-2">
                  <span class="text-xs font-semibold text-slate-500">{{
                    item.createdAt | date: 'short'
                  }}</span
                  ><svg
                    xmlns="http://www.w3.org/2000/svg"
                    width="20"
                    height="20"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    class="lucide lucide-dot text-[#1877f2]"
                    aria-hidden="true"
                  >
                    <circle cx="12.1" cy="12.1" r="1"></circle>
                  </svg>
                </div>
              </div>
              <p class="mt-0.5 text-sm text-slate-600">{{ item.entity.body }}</p>
              <div class="mt-2 flex items-center gap-2">
                <button
                  class="inline-flex items-center gap-1.5 rounded-md bg-white px-2.5 py-1 text-xs font-bold text-[#1877f2] ring-1 ring-[#dbeafe] transition hover:bg-[#e7f3ff]"
                >
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    width="13"
                    height="13"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    class="lucide lucide-check"
                    aria-hidden="true"
                  >
                    <path d="M20 6 9 17l-5-5"></path></svg
                  >Mark as read
                </button>
              </div>
            </div>
          </article>
        }
      </div>
    </section>
  </main>
</div>
